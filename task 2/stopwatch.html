<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chronos — Stopwatch</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:       #07080d;
  --surface:  #0e1018;
  --card:     #12151f;
  --border:   rgba(255,255,255,0.06);
  --accent:   #00e5ff;
  --accent2:  #ff4d6d;
  --accent3:  #ffe066;
  --text:     #e4e6f0;
  --muted:    #555a72;
  --ring-sz:  260px;
}

html,body{height:100%}

body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow-x:hidden;
  position:relative;
}

/* ── ambient blobs ── */
body::before,body::after{
  content:'';
  position:fixed;
  border-radius:50%;
  filter:blur(110px);
  pointer-events:none;
  z-index:0;
}
body::before{
  width:420px;height:420px;
  background:rgba(0,229,255,0.06);
  top:-100px;left:-80px;
}
body::after{
  width:380px;height:380px;
  background:rgba(255,77,109,0.05);
  bottom:-60px;right:-60px;
}

/* ── grain texture ── */
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
}

/* ── layout ── */
.app{
  position:relative;z-index:2;
  width:100%;max-width:520px;
  padding:48px 24px 60px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}

/* ── header ── */
header{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:52px;
}

.brand{
  display:flex;align-items:center;gap:10px;
}

.brand-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  animation:breathe 2.4s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(0.65);opacity:0.4}
}

.brand-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.5rem;letter-spacing:0.12em;color:var(--text);
}

.status-pill{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.68rem;font-weight:500;letter-spacing:0.08em;
  text-transform:uppercase;
  padding:5px 12px;border-radius:100px;
  border:1px solid var(--border);
  color:var(--muted);
  transition:all 0.4s;
}

.status-pill.running{
  border-color:rgba(0,229,255,0.3);
  color:var(--accent);
  background:rgba(0,229,255,0.06);
  box-shadow:0 0 12px rgba(0,229,255,0.15);
}

.status-pill.paused{
  border-color:rgba(255,224,102,0.3);
  color:var(--accent3);
  background:rgba(255,224,102,0.05);
}

/* ── ring clock ── */
.ring-wrap{
  position:relative;
  width:var(--ring-sz);height:var(--ring-sz);
  margin-bottom:44px;
  flex-shrink:0;
}

.ring-svg{
  position:absolute;inset:0;
  transform:rotate(-90deg);
  overflow:visible;
}

.ring-track{
  fill:none;
  stroke:rgba(255,255,255,0.04);
  stroke-width:3;
}

.ring-progress{
  fill:none;
  stroke:url(#ringGrad);
  stroke-width:3;
  stroke-linecap:round;
  stroke-dasharray:769; /* 2π×122.5 ≈ 769 */
  stroke-dashoffset:769;
  transition:stroke-dashoffset 0.25s linear;
  filter:drop-shadow(0 0 6px var(--accent));
}

.ring-tick{
  fill:none;
  stroke:rgba(255,255,255,0.08);
  stroke-width:1;
}

.ring-inner{
  position:absolute;
  inset:20px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #161926, #0c0e16);
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,0.6),
    inset 0 -1px 4px rgba(255,255,255,0.03),
    0 0 0 1px rgba(255,255,255,0.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
}

/* ── time display ── */
.time-main{
  font-family:'Bebas Neue',sans-serif;
  font-size:4.8rem;letter-spacing:0.04em;
  line-height:1;
  color:var(--text);
  text-shadow:0 0 30px rgba(0,229,255,0.15);
  transition:color 0.3s;
}

.time-ms{
  font-family:'IBM Plex Mono',monospace;
  font-size:1.1rem;font-weight:300;
  color:var(--accent);
  letter-spacing:0.06em;
  opacity:0.85;
}

.time-label{
  font-size:0.65rem;font-weight:500;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--muted);
  margin-top:2px;
}

/* ── tick marks (SVG generated in JS) ── */

/* ── controls ── */
.controls{
  display:flex;align-items:center;gap:16px;
  margin-bottom:44px;
}

.btn{
  border:none;cursor:pointer;
  font-family:'Outfit',sans-serif;font-weight:600;
  transition:transform 0.15s, box-shadow 0.2s, opacity 0.2s;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}

.btn:active{transform:scale(0.93)!important;}

.btn-main{
  width:72px;height:72px;border-radius:50%;
  font-size:0;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}

.btn-start{
  background:linear-gradient(135deg,#00e5ff,#0090cc);
  box-shadow:0 6px 28px rgba(0,229,255,0.35);
}
.btn-start:hover{
  transform:scale(1.06);
  box-shadow:0 8px 36px rgba(0,229,255,0.5);
}

.btn-pause{
  background:linear-gradient(135deg,#ffe066,#e6a800);
  box-shadow:0 6px 28px rgba(255,224,102,0.3);
}
.btn-pause:hover{
  transform:scale(1.06);
  box-shadow:0 8px 36px rgba(255,224,102,0.45);
}

.btn-icon{
  width:22px;height:22px;
  fill:rgba(0,0,0,0.75);
  pointer-events:none;
}

/* secondary buttons */
.btn-sm{
  width:52px;height:52px;border-radius:50%;
  background:var(--card);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:0.75rem;letter-spacing:0.06em;
}

.btn-sm svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.btn-reset:hover{color:var(--accent2);border-color:rgba(255,77,109,0.3);box-shadow:0 0 16px rgba(255,77,109,0.15);transform:scale(1.06);}
.btn-lap:hover{color:var(--accent);border-color:rgba(0,229,255,0.3);box-shadow:0 0 16px rgba(0,229,255,0.12);transform:scale(1.06);}

.btn-sm:disabled{opacity:0.3;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

/* ── stats row ── */
.stats{
  display:flex;gap:0;
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:28px;
}

.stat{
  flex:1;padding:16px 12px;text-align:center;
  position:relative;
}

.stat+.stat::before{
  content:'';
  position:absolute;left:0;top:20%;bottom:20%;
  width:1px;background:var(--border);
}

.stat-val{
  font-family:'IBM Plex Mono',monospace;
  font-size:1.05rem;font-weight:500;
  color:var(--text);margin-bottom:4px;
  transition:color 0.3s;
}

.stat-key{
  font-size:0.65rem;font-weight:500;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--muted);
}

/* ── laps ── */
.laps-header{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}

.laps-title{
  font-size:0.7rem;font-weight:600;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--muted);
}

.laps-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.7rem;color:var(--muted);
}

.laps-list{
  width:100%;
  display:flex;flex-direction:column;gap:6px;
  max-height:280px;overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.08) transparent;
}

.laps-list::-webkit-scrollbar{width:3px;}
.laps-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}

.lap-row{
  display:flex;align-items:center;
  padding:12px 16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  gap:12px;
  animation:lapIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;overflow:hidden;
}

@keyframes lapIn{
  from{opacity:0;transform:translateY(-6px) scale(0.98)}
  to{opacity:1;transform:none}
}

.lap-row::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;
  width:3px;
  border-radius:2px 0 0 2px;
  background:var(--muted);
  opacity:0.3;
}

.lap-row.fastest::before{background:var(--accent);opacity:1;}
.lap-row.slowest::before{background:var(--accent2);opacity:1;}

.lap-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.72rem;font-weight:500;letter-spacing:0.06em;
  color:var(--muted);min-width:36px;
}

.lap-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;}
.lap-bar{height:100%;border-radius:2px;background:rgba(255,255,255,0.1);transition:width 0.4s ease;}
.lap-row.fastest .lap-bar{background:rgba(0,229,255,0.4);}
.lap-row.slowest .lap-bar{background:rgba(255,77,109,0.4);}

.lap-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.88rem;font-weight:400;
  color:var(--text);min-width:90px;text-align:right;
}

.lap-badge{
  font-size:0.58rem;font-weight:600;letter-spacing:0.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:100px;
}

.lap-badge.fast{background:rgba(0,229,255,0.1);color:var(--accent);}
.lap-badge.slow{background:rgba(255,77,109,0.1);color:var(--accent2);}

.laps-empty{
  width:100%;text-align:center;
  padding:32px 0;color:var(--muted);
  font-size:0.85rem;line-height:1.8;
}

/* ── footer ── */
footer{
  position:relative;z-index:2;
  margin-top:auto;padding:24px;
  font-size:0.7rem;letter-spacing:0.08em;color:var(--muted);
  text-align:center;
}

/* ── flash animation on lap record ── */
@keyframes flashAccent{
  0%{color:var(--accent);text-shadow:0 0 20px var(--accent)}
  100%{color:var(--text);text-shadow:none}
}
.flash{animation:flashAccent 0.6s ease-out forwards;}
</style>
</head>
<body>
<div class="grain"></div>

<div class="app">

  <!-- header -->
  <header>
    <div class="brand">
      <div class="brand-dot" id="brandDot"></div>
      <span class="brand-name">Chronos</span>
    </div>
    <div class="status-pill" id="statusPill">READY</div>
  </header>

  <!-- ring clock -->
  <div class="ring-wrap" id="ringWrap">
    <svg class="ring-svg" viewBox="0 0 260 260" id="ringSvg">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#0055ff"/>
        </linearGradient>
      </defs>
      <!-- tick marks -->
      <g id="ticks"></g>
      <!-- track -->
      <circle class="ring-track" cx="130" cy="130" r="122.5"/>
      <!-- progress -->
      <circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="122.5"/>
    </svg>

    <div class="ring-inner">
      <div class="time-main" id="timeMain">00:00</div>
      <div class="time-ms" id="timeMs">.000</div>
      <div class="time-label">elapsed</div>
    </div>
  </div>

  <!-- controls -->
  <div class="controls">
    <!-- reset -->
    <button class="btn btn-sm btn-reset" id="btnReset" disabled title="Reset">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
    </button>

    <!-- start/pause main -->
    <button class="btn btn-main btn-start" id="btnMain" title="Start">
      <!-- play icon -->
      <svg class="btn-icon" id="iconPlay" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      <!-- pause icon -->
      <svg class="btn-icon" id="iconPause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="3" width="4" height="18" rx="1"/><rect x="14" y="3" width="4" height="18" rx="1"/></svg>
    </button>

    <!-- lap -->
    <button class="btn btn-sm btn-lap" id="btnLap" disabled title="Lap">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
    </button>
  </div>

  <!-- stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="statLaps">0</div>
      <div class="stat-key">Laps</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statBest">--</div>
      <div class="stat-key">Best</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statAvg">--</div>
      <div class="stat-key">Avg</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statWorst">--</div>
      <div class="stat-key">Worst</div>
    </div>
  </div>

  <!-- laps list -->
  <div class="laps-header">
    <span class="laps-title">Lap Times</span>
    <span class="laps-count" id="lapsCount"></span>
  </div>
  <div class="laps-list" id="lapsList">
    <div class="laps-empty" id="lapsEmpty">
      Press ⏱ start, then record laps.<br/>Your splits will appear here.
    </div>
  </div>

</div>

<footer>PRODIGY INFOTECH · INTERNSHIP TASK 02</footer>

<script>
/* ── tick marks ── */
(function buildTicks(){
  const g = document.getElementById('ticks');
  const cx=130,cy=130,r=122.5;
  for(let i=0;i<60;i++){
    const a = (i/60)*2*Math.PI - Math.PI/2;
    const isMajor = i%5===0;
    const r1 = r - (isMajor?10:5);
    const r2 = r - 1;
    const x1=cx+r1*Math.cos(a), y1=cy+r1*Math.sin(a);
    const x2=cx+r2*Math.cos(a), y2=cy+r2*Math.sin(a);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1.toFixed(2)); line.setAttribute('y1',y1.toFixed(2));
    line.setAttribute('x2',x2.toFixed(2)); line.setAttribute('y2',y2.toFixed(2));
    line.setAttribute('stroke', isMajor?'rgba(255,255,255,0.14)':'rgba(255,255,255,0.055)');
    line.setAttribute('stroke-width', isMajor?'1.5':'1');
    line.setAttribute('stroke-linecap','round');
    g.appendChild(line);
  }
})();

/* ── state ── */
let startTime=0, elapsed=0, rafId=null;
let running=false;
let lapStart=0, laps=[];
const CIRCUMFERENCE = 2*Math.PI*122.5; // ≈ 769.69

/* ── elements ── */
const timeMain   = document.getElementById('timeMain');
const timeMs     = document.getElementById('timeMs');
const ringProg   = document.getElementById('ringProgress');
const btnMain    = document.getElementById('btnMain');
const btnReset   = document.getElementById('btnReset');
const btnLap     = document.getElementById('btnLap');
const iconPlay   = document.getElementById('iconPlay');
const iconPause  = document.getElementById('iconPause');
const statusPill = document.getElementById('statusPill');
const brandDot   = document.getElementById('brandDot');
const lapsList   = document.getElementById('lapsList');
const lapsEmpty  = document.getElementById('lapsEmpty');
const statLaps   = document.getElementById('statLaps');
const statBest   = document.getElementById('statBest');
const statAvg    = document.getElementById('statAvg');
const statWorst  = document.getElementById('statWorst');
const lapsCount  = document.getElementById('lapsCount');

/* ── format helpers ── */
function fmt(ms){
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  const s = Math.floor((ms%60000)/1000);
  if(h>0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtMs(ms){
  return '.' + String(Math.floor(ms%1000)).padStart(3,'0');
}

function fmtLap(ms){
  const m = Math.floor(ms/60000);
  const s = Math.floor((ms%60000)/1000);
  const cs= Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

/* ── ring progress ── */
function setRing(ms){
  // full rotation every 60s
  const frac = (ms % 60000) / 60000;
  const offset = CIRCUMFERENCE - frac * CIRCUMFERENCE;
  ringProg.style.strokeDashoffset = offset;
}

/* ── render loop ── */
function render(){
  const now = running ? Date.now() : startTime + elapsed;
  const total = running ? (Date.now() - startTime + elapsed) : elapsed;

  timeMain.textContent = fmt(total);
  timeMs.textContent   = fmtMs(total);
  setRing(total);

  if(running) rafId = requestAnimationFrame(render);
}

/* ── start/pause ── */
function startStop(){
  if(!running){
    // start
    startTime = Date.now();
    lapStart  = lapStart === 0 ? Date.now() - (elapsed > 0 ? 0 : 0) : lapStart;
    if(laps.length===0 && elapsed===0) lapStart = Date.now();
    running = true;

    iconPlay.style.display  = 'none';
    iconPause.style.display = 'block';
    btnMain.classList.replace('btn-start','btn-pause');
    btnLap.disabled  = false;
    btnReset.disabled= false;

    statusPill.textContent = 'RUNNING';
    statusPill.className   = 'status-pill running';
    brandDot.style.animationDuration = '0.8s';

    rafId = requestAnimationFrame(render);
  } else {
    // pause
    elapsed += Date.now() - startTime;
    running  = false;
    cancelAnimationFrame(rafId);

    iconPlay.style.display  = 'block';
    iconPause.style.display = 'none';
    btnMain.classList.replace('btn-pause','btn-start');

    statusPill.textContent = 'PAUSED';
    statusPill.className   = 'status-pill paused';
    brandDot.style.animationDuration = '2.4s';

    render();
  }
}

/* ── lap ── */
function recordLap(){
  if(!running) return;
  const now     = Date.now();
  const lapMs   = now - lapStart;
  lapStart      = now;
  const total   = now - startTime + elapsed;
  laps.unshift({ n:laps.length+1, ms:lapMs, total });
  renderLaps();
  // flash
  timeMain.classList.remove('flash');
  void timeMain.offsetWidth;
  timeMain.classList.add('flash');
}

/* ── reset ── */
function reset(){
  running = false;
  cancelAnimationFrame(rafId);
  elapsed = 0; lapStart = 0; laps = [];

  timeMain.textContent = '00:00';
  timeMs.textContent   = '.000';
  ringProg.style.strokeDashoffset = CIRCUMFERENCE;

  iconPlay.style.display  = 'block';
  iconPause.style.display = 'none';
  btnMain.classList.replace('btn-pause','btn-start');
  btnReset.disabled = true;
  btnLap.disabled   = true;

  statusPill.textContent = 'READY';
  statusPill.className   = 'status-pill';
  brandDot.style.animationDuration = '2.4s';

  renderLaps();
}

/* ── render laps ── */
function renderLaps(){
  statLaps.textContent = laps.length;

  if(laps.length === 0){
    lapsList.innerHTML = '';
    lapsList.appendChild(lapsEmpty);
    statBest.textContent = '--';
    statAvg.textContent  = '--';
    statWorst.textContent= '--';
    lapsCount.textContent= '';
    return;
  }

  const times   = laps.map(l=>l.ms);
  const minTime = Math.min(...times);
  const maxTime = Math.max(...times);
  const avgTime = times.reduce((a,b)=>a+b,0)/times.length;

  statBest.textContent  = fmtLap(minTime);
  statWorst.textContent = fmtLap(maxTime);
  statAvg.textContent   = fmtLap(avgTime);
  lapsCount.textContent = laps.length + ' splits';

  lapsList.innerHTML = '';
  laps.forEach((lap,i)=>{
    const isFastest = lap.ms === minTime && laps.length > 1;
    const isSlowest = lap.ms === maxTime && laps.length > 1;
    const pct = laps.length > 1
      ? ((lap.ms - minTime) / (maxTime - minTime) * 70 + 10).toFixed(1)
      : '40';

    const row = document.createElement('div');
    row.className = 'lap-row' + (isFastest?' fastest':isSlowest?' slowest':'');

    row.innerHTML = `
      <span class="lap-num">LAP ${lap.n}</span>
      <div class="lap-bar-wrap"><div class="lap-bar" style="width:${pct}%"></div></div>
      <span class="lap-time">${fmtLap(lap.ms)}</span>
      ${isFastest?'<span class="lap-badge fast">BEST</span>':''}
      ${isSlowest?'<span class="lap-badge slow">SLOW</span>':''}
    `;
    lapsList.appendChild(row);
  });
}

/* ── keyboard shortcuts ── */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){e.preventDefault(); startStop();}
  if(e.code==='KeyL' && running) recordLap();
  if(e.code==='KeyR' && !running && elapsed>0) reset();
});

/* ── bind buttons ── */
btnMain.addEventListener('click', startStop);
btnLap.addEventListener('click', recordLap);
btnReset.addEventListener('click', reset);

/* ── init ── */
ringProg.style.strokeDasharray  = CIRCUMFERENCE;
ringProg.style.strokeDashoffset = CIRCUMFERENCE;
</script>
</body>
</html>
